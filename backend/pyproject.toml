[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windgas"
version = "0.1.0"
description = "Monitor weather-driven pressure on gas-fired electricity generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "entsoe-py>=0.7.8",
  "pandas>=2.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
windgas = "windgas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
